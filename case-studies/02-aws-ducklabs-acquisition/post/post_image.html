<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post Image - Charlton Smith</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      width: 1080px;
      height: 1350px;
      background-color: #000000;
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 120px;
      overflow: hidden;
      position: relative;
    }

    /* Profile Header */
    .profile-card {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 68px;
    }

    .profile-avatar {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      object-fit: cover;
    }

    .profile-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .profile-name-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile-name {
      font-size: 36px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.02em;
    }

    .verified-badge {
      width: 28px;
      height: 28px;
    }

    .profile-handle {
      font-size: 26px;
      font-weight: 400;
      color: #71767B;
    }

    /* Content block matching Tobi's exact rhythm */
    .content-statement {
      display: flex;
      flex-direction: column;
      gap: 58px;
      max-width: 840px;
    }

    .content-paragraph {
      font-size: 46px;
      font-weight: 600;
      line-height: 1.34;
      letter-spacing: -0.02em;
      color: #FFFFFF;
      word-break: keep-all;
      hyphens: none;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <img src="profile_picture.png" alt="Charlton Smith" class="profile-avatar">
    <div class="profile-details">
      <div class="profile-name-row">
        <span class="profile-name">Charlton Smith</span>
        <svg class="verified-badge" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" fill="#1D9BF0"/>
          <path d="M7.5 12L10.5 15L16.5 9" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="profile-handle">@charltonsmith</span>
    </div>
  </div>

  <div class="content-statement">
    <p class="content-paragraph">
      AWS just acquired DuckLabs, the team behind DuckDB.
    </p>

    <p class="content-paragraph">
      Enterprise vendors charge $150k/year to lock your data inside proprietary data warehouses.
    </p>

    <p class="content-paragraph">
      You don't need a six-figure warehouse when you can query your files directly in cloud storage.
    </p>
  </div>

</body>
</html>
